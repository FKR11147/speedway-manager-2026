* {

}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #111;
  color: #fff;
}

button,
select {
  font: inherit;
}

header {
  background: #181818;
  border-bottom: 1px solid #333;
  padding: 16px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

header h1 {
  margin: 0;
  font-size: 21px;
}

.version {
  margin-top: 5px;
  color: #999;
  font-size: 12px;
}

.container {
  width: 100%;
  max-width: 850px;
  margin: auto;
  padding: 16px;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.card {
  background: #1b1b1b;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
}

h2 {
  margin-top: 0;
}

h3 {
  margin-bottom: 8px;
}

.small {
  color: #aaa;
  font-size: 13px;
}

.club-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.club-button {
  background: #222;
  border: 1px solid #444;
  color: white;
  border-radius: 14px;
  padding: 14px 10px;
  cursor: pointer;
  text-align: left;
}

.club-button:hover {
  background: #2b2b2b;
}

.club-logo {
  width: 50px;
  height: 50px;
  border-radius: 12px;
  background: #303030;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 10px;
}

.club-name {
  font-weight: bold;
  font-size: 14px;
}

.club-city {
  color: #999;
  font-size: 12px;
  margin-top: 4px;
}

.match-header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  text-align: center;
}

.team-box {
  background: #222;
  border: 1px solid #444;
  border-radius: 12px;
  padding: 12px;
}

.team-short {
  font-size: 20px;
  font-weight: bold;
}

.vs {
  color: #999;
  font-weight: bold;
}

.score {
  font-size: 32px;
  font-weight: bold;
  margin-top: 8px;
}

.roster-grid {
  display: grid;
  gap: 8px;
}

.slot {
  background: #202020;
  border: 1px solid #383838;
  border-radius: 12px;
  padding: 12px;
}

.slot-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.slot-number {
  font-weight: bold;
  font-size: 18px;
}

.slot-role {
  color: #aaa;
  font-size: 11px;
  text-transform: uppercase;
}

.slot-rider {
  margin-top: 8px;
  font-weight: bold;
}

.slot-info {
  margin-top: 4px;
  color: #aaa;
  font-size: 12px;
}

.slot button {
  margin-top: 9px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 14px;
  cursor: pointer;
}

.primary {
  width: 100%;
  background: #fff;
  color: #111;
  font-weight: bold;
}

.secondary {
  background: #2c2c2c;
  color: white;
  border: 1px solid #444;
}

.danger {
  background: #421d1d;
  color: #fff;
}

.rider-list {
  display: grid;
  gap: 7px;
  max-height: 430px;
  overflow-y: auto;
}

.rider-button {
  width: 100%;
  background: #242424;
  color: white;
  border: 1px solid #3c3c3c;
  text-align: left;
  padding: 11px;

.rider-button:disabled {

}

.rider-name {

}

.rider-meta {

.heat {

const GAME_DATE = new Date("2026-09-14T12:00:00");


/* =========================================================
   FUNKCJE POMOCNICZE
   ========================================================= */

function calculateAge(birthDate) {

  if (!birthDate) {
    return null;
  }

  const birth = new Date(birthDate);

  let age =
    GAME_DATE.getFullYear() -
    birth.getFullYear();

  const monthDifference =
    GAME_DATE.getMonth() -
    birth.getMonth();

  if (
    monthDifference < 0 ||
    (
      monthDifference === 0 &&
      GAME_DATE.getDate() < birth.getDate()
    )
  ) {
    age--;
  }

  return age;
}


function formatDate(dateString) {

  if (!dateString) {
    return "brak danych";
  }

  const d = new Date(dateString);

  return d.toLocaleDateString("pl-PL");
}


function isU21(rider) {

  return rider.roles.includes("JUNIOR");
}


function isU24(rider) {

  return rider.roles.includes("U24");
}


function isSenior(rider) {

  return rider.roles.includes("SENIOR");
}


function isReserveEligible(rider) {

  return rider.roles.includes("REZERWA") && isU24(rider);
}


function isForeign(rider) {

  return rider.nationality !== "POL";
}


function roleText(rider) {

  return rider.roles.join(" • ");
}


function slotAllowed(rider, slot) {

  /*
    1–5 / 9–13:
    normalny numer seniorki/U24.
    Junior może tutaj wystąpić, jeśli posiada również
    odpowiednią rolę.

    6–7 / 14–15:
    JUNIOR.

    8 / 16:
    REZERWA + U24.
  */

  if (slot >= 1 && slot <= 5) {
    return (
      isSenior(rider) ||
      isU24(rider)
    );
  }

  if (slot >= 9 && slot <= 13) {
    return (
      isSenior(rider) ||
      isU24(rider)
    );
  }

  if (
    slot === 6 ||
    slot === 7 ||
    slot === 14 ||
    slot === 15
  ) {
    return isU21(rider);
  }

  if (
    slot === 8 ||
    slot === 16
  ) {
    return isReserveEligible(rider);
  }

  return false;
}


function slotLabel(slot) {

  if (
    slot === 6 ||
    slot === 7 ||
    slot === 14 ||
    slot === 15
  ) {
    return "JUNIOR";
  }

  if (
    slot === 8 ||
    slot === 16
  ) {
    return "REZERWA U24";
  }

  return "SENIOR / U24";
}

let playerClub = null;
let opponentClub = null;

let selectedSlot = null;

let playerLineup = {};
let aiLineup = {};

let homeScore = 0;
let awayScore = 0;

let currentHeat = 1;

let heatFinished = false;


/* =========================================================
   EKRANY
   ========================================================= */

function showScreen(id) {

  document.querySelectorAll(".screen")
    .forEach(screen => {
      screen.classList.remove("active");
    });

  document.getElementById(id)
    .classList.add("active");
}


/* =========================================================
   KLUBY
   ========================================================= */

function renderClubs() {

  const grid =
    document.getElementById("clubGrid");

  grid.innerHTML = "";

  Object.values(clubs).forEach(club => {

    const button =
      document.createElement("button");

    button.className = "club-button";

    button.innerHTML = `
      <div class="club-logo">
        ${club.short}
      </div>

      <div class="club-name">
        ${club.name}
      </div>

      <div class="club-city">
        ${club.city}
      </div>
    `;

    button.addEventListener("click", () => {

      selectClub(club.id);

    });

    grid.appendChild(button);

  });
}


/* =========================================================
   WYBÓR KLUBU
   ========================================================= */

function selectClub(clubId) {

  playerClub = clubs[clubId];

  const available =
    Object.values(clubs)
      .filter(club => club.id !== clubId);

  opponentClub =
    available[
      Math.floor(
        Math.random() * available.length
      )
    ];

  playerLineup = {};
  aiLineup = {};

  selectedSlot = null;

  document.getElementById("lineupTitle").textContent =
    `${playerClub.name} — wybierz skład`;

  renderLineup();

  renderRiders();

  showScreen("lineupScreen");
}


/* =========================================================
   SLOTY
   ========================================================= */

function getPlayerSlots() {

  return [1,2,3,4,5,6,7,8];

}


function renderLineup() {

  const container =
    document.getElementById("lineupSlots");

  container.innerHTML = "";

  getPlayerSlots().forEach(slot => {

    const rider =
      playerLineup[slot];

    const div =
      document.createElement("div");

    div.className = "slot";

    div.innerHTML = `

      <div class="slot-header">

        <div class="slot-number">
          #${slot}
        </div>

        <div class="slot-role">
          ${slotLabel(slot)}
        </div>

      </div>

      ${
        rider

        ?

        `
        <div class="slot-rider">
          ${rider.name}
        </div>

        <div class="slot-info">
          ${getRiderAgeText(rider)}
        </div>

        <div class="badges">
          ${renderBadges(rider)}
        </div>

        <button
          class="secondary"
          onclick="removeRider(${slot})"
        >
          Usuń
        </button>
        `

        :

        `
        <div class="slot-info">
          Wolne miejsce
        </div>

        <button
          class="secondary"
          onclick="selectSlot(${slot})"
        >
          Wybierz zawodnika
        </button>
        `
      }

    `;

    if (selectedSlot === slot) {

      div.style.borderColor = "#fff";

    }

    container.appendChild(div);

  });

}


function selectSlot(slot) {

  selectedSlot = slot;

  renderLineup();

  renderRiders();

}


function removeRider(slot) {

  delete playerLineup[slot];

  selectedSlot = null;

  renderLineup();

  renderRiders();

}


/* =========================================================
   WIEK / ROLE
   ========================================================= */

function getRiderAgeText(rider) {

  const age =
    calculateAge(rider.birthDate);

  if (age === null) {

    return `
      wiek: brak danych
      • ur.: brak danych
    `;

  }

  return `
    wiek: ${age}
    • ur.: ${formatDate(rider.birthDate)}
  `;

}


function renderBadges(rider) {

  return rider.roles
    .map(role => {

      let className = "";

      if (role === "JUNIOR") {
        className = "junior";
      }

      if (role === "U24") {
        className = "u24";
      }

      if (role === "SENIOR") {
        className = "senior";
      }

      if (role === "REZERWA") {
        className = "reserve";
      }

      return `
        <span class="badge ${className}">
          ${role}
        </span>
      `;

    })
    .join("");

}


/* =========================================================
   WYBÓR ZAWODNIKA
   ========================================================= */

function renderRiders() {

  const container =
    document.getElementById("riderList");

  container.innerHTML = "";

  if (!selectedSlot) {

    container.innerHTML = `
      <div class="small">
        Najpierw wybierz numer startowy.
      </div>
    `;

    return;

  }

  const usedIds =
    Object.values(playerLineup)
      .map(rider => rider.name);

  playerClub.riders.forEach(rider => {

    const button =
      document.createElement("button");

    button.className = "rider-button";

    const alreadyUsed =
      usedIds.includes(rider.name);

    const allowed =
      slotAllowed(
        rider,
        selectedSlot
      );

    button.disabled =
      alreadyUsed || !allowed;

    button.innerHTML = `

      <div class="rider-name">
        ${rider.name}
      </div>

      <div class="rider-meta">
        ${getRiderAgeText(rider)}
      </div>

      <div class="badges">
        ${renderBadges(rider)}
      </div>

    `;

    if (!allowed) {

      button.title =
        "Zawodnik nie spełnia wymagań tego numeru";

    }

    if (alreadyUsed) {

      button.title =
        "Ten zawodnik jest już wybrany";

    }

    button.addEventListener("click", () => {

      chooseRider(rider);

    });

    container.appendChild(button);

  });

}


/* =========================================================
   WYBÓR ZAWODNIKA GRACZA
   ========================================================= */

function chooseRider(rider) {

  if (!selectedSlot) {
    return;
  }

  if (!slotAllowed(rider, selectedSlot)) {

    showLineupError(
      "Ten zawodnik nie może jechać z wybranym numerem."
    );

    return;

  }

  const duplicate =
    Object.values(playerLineup)
      .some(
        selected =>
          selected.name === rider.name
      );

  if (duplicate) {

    showLineupError(
      "Tego zawodnika wybrałeś już wcześniej."
    );

    return;

  }

  /*
    Kontrola zagranicznych juniorów.
  */

  if (
    isU21(rider) &&
    isForeign(rider)
  ) {

    const foreignJuniorAlready =
      Object.values(playerLineup)
        .some(
          selected =>
            isU21(selected) &&
            isForeign(selected)
        );

    if (foreignJuniorAlready) {

      showLineupError(
        "W składzie mogą być maksymalnie dwa miejsca juniorskie, ale tylko jeden zagraniczny junior."
      );

      return;

    }

  }

  playerLineup[selectedSlot] =
    rider;

  selectedSlot = null;

  clearLineupError();

  renderLineup();

  renderRiders();

}


/* =========================================================
   KOMUNIKATY
   ========================================================= */

function showLineupError(message) {

  const box =
    document.getElementById("lineupError");

  box.textContent =
    message;

  box.classList.remove("hidden");

}


function clearLineupError() {

  document
    .getElementById("lineupError")
    .classList.add("hidden");

}


/* =========================================================
   SPRAWDZENIE SKŁADU
   ========================================================= */

function validateLineup() {

  const requiredSlots =
    [1,2,3,4,5,6,7,8];

  for (const slot of requiredSlots) {

    if (!playerLineup[slot]) {

      showLineupError(
        `Uzupełnij numer ${slot}.`
      );

      return false;

    }

  }

  const riders =
    Object.values(playerLineup);

  const unique =
    new Set(
      riders.map(
        rider => rider.name
      )
    );

  if (
    unique.size !== riders.length
  ) {

    showLineupError(
      "Ten sam zawodnik został wybrany więcej niż raz."
    );

    return false;

  }


  /*
    Dokładnie dwóch juniorów.
  */

  const juniorSlots =
    [6,7];

  const juniors =
    juniorSlots
      .map(slot => playerLineup[slot]);

  if (
    juniors.some(
      rider => !isU21(rider)
    )
  ) {

    showLineupError(
      "Numery 6 i 7 muszą być obsadzone juniorami."
    );

    return false;

  }


  /*
    Maksymalnie jeden zagraniczny junior.
  */

  const foreignJuniors =
    juniors.filter(
      rider => isForeign(rider)
    );

  if (
    foreignJuniors.length > 1
  ) {

    showLineupError(
      "Maksymalnie jeden junior zagraniczny."
    );

    return false;

  }


  /*
    Rezerwa musi być U24.
  */

  if (
    !isReserveEligible(
      playerLineup[8]
    )
  ) {

    showLineupError(
      "Numer 8 musi być obsadzony rezerwą U24."
    );

    return false;

  }

  return true;

}


/* =========================================================
   AI — BUDOWANIE SKŁADU
   ========================================================= */

function buildAI() {

  const riders =
    [...opponentClub.riders];

  const lineup = {};

  const used = new Set();

  let foreignJuniorCount = 0;


  function chooseBest(candidates) {

    const available =
      candidates.filter(
        rider =>
          !used.has(rider.name)
      );

    available.sort(
      (a,b) =>
        b.aiPriority - a.aiPriority
    );

    return available[0] || null;

  }


  /*
    KROK 1
    JUNIOR 1
  */

  let juniorCandidates =
    riders.filter(
      rider =>
        isU21(rider)
    );

  let junior1 =
    chooseBest(juniorCandidates);

  if (junior1) {

    lineup[6] =
      junior1;

    used.add(junior1.name);

    if (isForeign(junior1)) {
      foreignJuniorCount++;
    }

  }


  /*
    KROK 2
    JUNIOR 2

    Jeżeli pierwszy junior jest zagraniczny,
    wybieramy Polaka.
  */

  juniorCandidates =
    riders.filter(
      rider =>
        isU21(rider) &&
        !used.has(rider.name) &&
        (
          !isForeign(rider) ||
          foreignJuniorCount === 0
        )
    );

  let junior2 =
    chooseBest(juniorCandidates);

  if (!junior2) {

    /*
      Awaryjnie szukamy dowolnego legalnego
      juniora, który nie łamie zasady.
    */

    junior2 =
      riders.find(
        rider =>
          isU21(rider) &&
          !used.has(rider.name) &&
          (
            !isForeign(rider) ||
            foreignJuniorCount < 1
          )
      );

  }

  if (junior2) {

    lineup[7] =
      junior2;

    used.add(junior2.name);

    if (isForeign(junior2)) {
      foreignJuniorCount++;
    }

  }


  /*
    KROK 3
    NUMERY 1–5

    Najpierw najmocniejsi zawodnicy
    SENIOR / U24.
  */

  const normalCandidates =
    riders
      .filter(
        rider =>
          !used.has(rider.name) &&
          (
            isSenior(rider) ||
            isU24(rider)
          )
      )
      .sort(
        (a,b) =>
          b.aiPriority - a.aiPriority
      );


  const normalSlots =
    [1,2,3,4,5];

  normalSlots.forEach(slot => {

    const rider =
      normalCandidates.find(
        candidate =>
          !used.has(
            candidate.name
          )
      );

    if (rider) {

      lineup[slot] =
        rider;

      used.add(
        rider.name
      );

    }

  });


  /*
    KROK 4
    REZERWA #8
  */

  let reserveCandidates =
    riders
      .filter(
        rider =>
          !used.has(rider.name) &&
          isReserveEligible(rider)
      )
      .sort(
        (a,b) =>
          b.aiPriority - a.aiPriority
      );


  /*
    Jeżeli nie ma wolnego zawodnika
    z rolą REZERWA, dopuszczamy dowolnego
    U24 — system później oznaczy go jako
    kandydat do rezerwy.
  */

  let reserve =
    reserveCandidates[0];


  if (!reserve) {

    reserve =
      riders
        .filter(
          rider =>
            !used.has(rider.name) &&
            isU24(rider)
        )
        .sort(
          (a,b) =>
            b.aiPriority - a.aiPriority
        )[0];

  }


  if (reserve) {

    lineup[8] =
      reserve;

    used.add(
      reserve.name
    );

  }


  /*
    KROK 5
    Jeżeli z jakiegoś powodu skład nie ma 8 zawodników,
    uzupełniamy wolne miejsce legalnym zawodnikiem.
  */

  for (
    let slot = 1;
    slot <= 8;
    slot++
  ) {

    if (lineup[slot]) {
      continue;
    }

    const candidate =
      riders
        .filter(
          rider =>
            !used.has(rider.name) &&
            slotAllowed(
              rider,
              slot
            )
        )
        .sort(
          (a,b) =>
            b.aiPriority - a.aiPriority
        )[0];

    if (candidate) {

      lineup[slot] =
        candidate;

      used.add(
        candidate.name
      );

    }

  }


  return lineup;

}


/* =========================================================
   START MECZU
   ========================================================= */

function startMatch() {

  clearLineupError();

  if (!validateLineup()) {
    return;
  }

  aiLineup =
    buildAI();

  const aiSlots =
    [1,2,3,4,5,6,7,8];

  const missing =
    aiSlots.some(
      slot =>
        !aiLineup[slot]
    );

  if (missing) {

    showLineupError(
      "AI nie mogło zbudować legalnego składu przeciwnika."
    );

    return;

  }

  homeScore = 0;
  awayScore = 0;

  currentHeat = 1;

  heatFinished = false;

  setupMatchScreen();

  showScreen("matchScreen");

}

const heatMatrix = [

  [1,9,3,11],
  [15,6,14,7],
  [5,12,2,13],
  [14,4,10,6],
  [11,3,12,4],
  [13,2,15,1],
  [7,10,5,9],
  [3,13,4,14],
  [9,1,10,2],
  [6,11,5,12],
  [12,4,9,1],
  [2,15,7,11],
  [10,5,13,3],

  /*
    Biegi XIV i XV zostawiamy
    na późniejszą wersję.
  */

];


function prepareHeat() {

  heatFinished = false;

  document.getElementById(
    "simulateButton"
  ).classList.remove("hidden");

  document.getElementById(
    "nextHeatButton"
  ).classList.add("hidden");


  const heat =
    heatMatrix[
      currentHeat - 1
    ];

  document.getElementById(
    "heatTitle"
  ).textContent =
    `Bieg ${currentHeat}`;


  const ridersContainer =
    document.getElementById(
      "heatRiders"
    );

  ridersContainer.innerHTML = "";


  heat.forEach(
    (number, index) => {

      let rider;

      let team;

      if (number <= 8) {

        rider =
          aiLineup[number];

        team =
          opponentClub;

      } else {

        const realNumber =
          number - 8;

        rider =
          playerLineup[
            realNumber
          ];

        team =
          playerClub;

      }


      const div =
        document.createElement("div");

      div.className =
        "heat-rider";

      div.innerHTML = `

        <span>
          <b>${index + 1}.</b>
          ${rider.name}
          <span class="small">
            (${team.short})
          </span>
        </span>

        <span class="points">
          ?
        </span>

      `;

      ridersContainer.appendChild(div);

    }
  );

}


/* =========================================================
   SYMULACJA BIEGU
   ========================================================= */

function simulateHeat() {

  if (heatFinished) {
    return;
  }

  const heat =
    heatMatrix[
      currentHeat - 1
    ];

  const competitors =
    heat.map(
      number => {

        if (number <= 8) {

          return {
            rider:
              aiLineup[number],
            team:
              "away",
            score:
              randomPerformance(
                aiLineup[number]
              )
          };

        }

        const realNumber =
          number - 8;

        return {
          rider:
            playerLineup[realNumber],
          team:
            "home",
          score:
            randomPerformance(
              playerLineup[realNumber]
            )
        };

      }
    );


  competitors.sort(
    (a,b) =>
      b.score - a.score
  );


  /*
    Punktacja:
    3-2-1-0
  */

  const points =
    [3,2,1,0];


  competitors.forEach(
    (competitor,index) => {

      competitor.points =
        points[index];

      if (
        competitor.team === "home"
      ) {

        homeScore +=
          competitor.points;

      } else {

        awayScore +=
          competitor.points;

      }

    }
  );


  updateHeatResult(
    competitors
  );

  updateScore();

  heatFinished = true;


  document.getElementById(
    "simulateButton"
  ).classList.add("hidden");


  if (
    currentHeat <
    heatMatrix.length
  ) {

    document.getElementById(
      "nextHeatButton"
    ).classList.remove("hidden");

  } else {

    showFinalResult();

  }

}


/* =========================================================
   LOSOWANIE FORMY
   ========================================================= */

function randomPerformance(rider) {

  const base =
    rider.aiPriority || 50;

  /*
    Lekki wpływ formy zawodnika,
    ale wynik nadal jest symulacją.
  */

  return (
    base +
    Math.random() * 35
  );

}


/* =========================================================
   WYNIK BIEGU
   ========================================================= */

function updateHeatResult(
  competitors
) {

  const container =
    document.getElementById(
      "heatRiders"
    );

  container.innerHTML = "";


  competitors.forEach(
    (competitor,index) => {

      const div =
        document.createElement("div");

      div.className =
        "heat-rider";

      const teamShort =
        competitor.team === "home"
          ? playerClub.short
          : opponentClub.short;

      div.innerHTML = `

        <span>
          <b>${index + 1}.</b>
          ${competitor.rider.name}

          <span class="small">
            (${teamShort})
          </span>
        </span>

        <span class="points">
          ${competitor.points}
        </span>

      `;

      container.appendChild(div);

    }
  );

}


/* =========================================================
   KOLEJNY BIEG
   ========================================================= */

function nextHeat() {

  if (!heatFinished) {
    return;
  }

  currentHeat++;

  prepareHeat();

}


/* =========================================================
   TABLICA WYNIKÓW
   ========================================================= */

function updateScore() {

  document.getElementById(
    "homeScore"
  ).textContent =
    homeScore;

  document.getElementById(
    "awayScore"
  ).textContent =
    awayScore;

}


/* =========================================================
   KONIEC MECZU
   ========================================================= */

function showFinalResult() {

  const box =
    document.getElementById(
      "heatBox"
    );

  let winnerText;

  if (
    homeScore > awayScore
  ) {

    winnerText =
      `${playerClub.name} wygrywa!`;

  } else if (
    awayScore > homeScore
  ) {

    winnerText =
      `${opponentClub.name} wygrywa!`;

  } else {

    winnerText =
      "Remis!";

  }


  box.innerHTML = `

    <div class="heat-title">
      Koniec meczu
    </div>

    <div class="match-result">

      <div style="font-size:18px;font-weight:bold;">
        ${winnerText}
      </div>

      <div style="font-size:30px;font-weight:bold;margin-top:10px;">
        ${homeScore} : ${awayScore}
      </div>

    </div>

    <br>

    <button
      class="primary"
      onclick="location.reload()"
    >
      Nowy mecz
    </button>

  `;

}


/* =========================================================
   PRZYCISKI
   ========================================================= */

document
  .getElementById("startMatchButton")
  .addEventListener(
    "click",
    startMatch
  );


document
  .getElementById("simulateButton")
  .addEventListener(
    "click",
    simulateHeat
  );


document
  .getElementById("nextHeatButton")
  .addEventListener(
    "click",
    nextHeat
  );


document
  .getElementById("backClubButton")
  .addEventListener(
    "click",
    () => {

      playerClub = null;
      opponentClub = null;

      playerLineup = {};
      aiLineup = {};

      showScreen(
        "clubScreen"
      );

    }
  );


/* =========================================================
   START
   ========================================================= */

renderClubs();

</script>

</body>
</html>
